services:
  - type: web
    name: HMS-1
    runtime: go
    buildCommand: ./build.sh
    startCommand: ./server
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production

  - type: static
    name: HMS-FRONTEND
    buildCommand: npm run build --workspace=MODULES/SUPER-ADMIN/FRONTEND/WEB
    staticPublishPath: MODULES/SUPER-ADMIN/FRONTEND/WEB/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

